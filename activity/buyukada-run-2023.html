<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Büyükada Run — 5 km completed on 22 October 2023 in 31:52.">
  <title>Büyükada Run · Beril Mountain Journal</title>
  <link rel="stylesheet" href="../src/styles/main.css">
</head>
<body>

<div id="nav-placeholder"></div>

<header class="page-header">
  <div class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="../index.html">Home</a>
      <span class="breadcrumb__sep">›</span>
      <a href="../activities.html">Activities</a>
      <span class="breadcrumb__sep">›</span>
      <span>Büyükada Run</span>
    </nav>
    <h1>Büyükada Run</h1>
    <p>5 km · 22 October 2023 · 31:52</p>
  </div>
</header>

<main>
  <div class="container">
    <div class="detail-layout">
      <article class="detail-main">
        <div style="aspect-ratio:16/9;border-radius:var(--radius-lg);overflow:hidden;margin-bottom:var(--s6)">
          <img src="../public/media/activities/running/buyukada-2023/buyukada-run.jpg" alt="Beril running the Büyükada 5K in 2023" style="width:100%;height:100%;object-fit:cover">
        </div>

        <h2>Race Record</h2>
        <p><strong>Event:</strong> Büyükada Run</p>
        <p><strong>Distance:</strong> 5 km</p>
        <p><strong>Date:</strong> 22 October 2023</p>
        <p><strong>Finish time:</strong> 31:52</p>

        <h2>Photos &amp; Course</h2>
        <div class="photo-grid">
          <div class="photo-grid__item" data-lightbox="../public/media/activities/running/buyukada-2023/buyukada-medal.jpg">
            <img src="../public/media/activities/running/buyukada-2023/buyukada-medal.jpg" alt="Beril holding her Büyükada race medal">
          </div>
          <div class="photo-grid__item" data-lightbox="../public/media/activities/running/buyukada-2023/buyukada-course-map.jpg">
            <img src="../public/media/activities/running/buyukada-2023/buyukada-course-map.jpg" alt="Map of the Büyükada 5K course">
          </div>
        </div>
      </article>

      <aside class="detail-sidebar">
        <div class="info-box">
          <div class="info-box__title">Run Info</div>
          <div class="info-row">
            <span class="info-row__label">Distance</span>
            <span class="info-row__value">5 km</span>
          </div>
          <div class="info-row">
            <span class="info-row__label">Date</span>
            <span class="info-row__value">22 October 2023</span>
          </div>
          <div class="info-row">
            <span class="info-row__label">Finish time</span>
            <span class="info-row__value">31:52</span>
          </div>
          <div class="info-row">
            <span class="info-row__label">Location</span>
            <span class="info-row__value">Büyükada, İstanbul</span>
          </div>
          <div class="info-row">
            <span class="info-row__label">Type</span>
            <span class="info-row__value">Running</span>
          </div>
        </div>
      </aside>
    </div>
  </div>
</main>

<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lightbox__close" aria-label="Close">×</button>
  <img class="lightbox__img" src="" alt="">
</div>

<div id="footer-placeholder"></div>
<script src="../src/js/components.js"></script>
</body>
</html>
