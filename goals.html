<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ağrı Dağı — Beril's next mountain objective.">
  <title>Mountains Ahead · Beril Mountain Journal</title>
  <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>

<div id="nav-placeholder"></div>

<header class="page-header">
  <div class="container">
    <h1>Mountains Ahead</h1>
    <p>The next objective: Ağrı Dağı.</p>
  </div>
</header>

<main>
  <section class="section">
    <div class="container">
      <div class="card-grid">
        <div class="goal-card">
          <img class="goal-card__image" src="public/media/goals/agri/agri-dagi-start.jpg" alt="Snow-covered Ağrı Dağı">
          <div class="goal-card__name">Ağrı Dağı</div>
          <div class="goal-card__elevation">5,137 m · Eastern Anatolia</div>
          <div class="goal-card__notes">
            The highest mountain in Turkey and the next objective.
          </div>
          <div class="goal-card__meta">
            <span class="badge badge--goal">Next</span>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="footer-placeholder"></div>
<script src="src/js/components.js"></script>
</body>
</html>
