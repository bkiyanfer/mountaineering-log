<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Emler, 3,723 m — summited on 29 September 2023 — Beril Mountain Journal.">
  <title>Emler · Beril Mountain Journal</title>
  <link rel="stylesheet" href="../src/styles/main.css">
</head>
<body>

<div id="nav-placeholder"></div>

<header class="page-header">
  <div class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="../index.html">Home</a>
      <span class="breadcrumb__sep">›</span>
      <a href="../summits.html">Summits</a>
      <span class="breadcrumb__sep">›</span>
      <span>Emler</span>
    </nav>
    <h1>Emler</h1>
    <p>3,723 m · Summited on 29 September 2023</p>
  </div>
</header>

<main>
  <div class="container">
    <div class="detail-layout">
      <article class="detail-main">
        <div style="aspect-ratio:16/9;border-radius:var(--radius-lg);overflow:hidden;margin-bottom:var(--s6)">
          <img src="../public/media/summits/emler/emler-summit.jpg" alt="Snow-covered Aladağlar seen from the Emler summit" style="width:100%;height:100%;object-fit:cover">
        </div>

        <h2>Summit Record</h2>
        <p><strong>Summited on:</strong> 29 September 2023</p>
        <p><strong>Summit:</strong> 3,723 m</p>

        <h2>Photos</h2>
        <div class="photo-grid">
          <div class="photo-grid__item" data-lightbox="../public/media/summits/emler/emler-camp.jpg">
            <img src="../public/media/summits/emler/emler-camp.jpg" alt="Camp beneath Emler">
          </div>
          <div class="photo-grid__item" data-lightbox="../public/media/summits/emler/emler-beril-1.jpg">
            <img src="../public/media/summits/emler/emler-beril-1.jpg" alt="Beril beside the Turkish flag at the Emler summit">
          </div>
          <div class="photo-grid__item" data-lightbox="../public/media/summits/emler/emler-beril-2.jpg">
            <img src="../public/media/summits/emler/emler-beril-2.jpg" alt="Beril on Emler">
          </div>
        </div>
      </article>

      <aside class="detail-sidebar">
        <div class="info-box">
          <div class="info-box__title">Summit Info</div>
          <div class="info-row">
            <span class="info-row__label">Elevation</span>
            <span class="info-row__value">3,723 m</span>
          </div>
          <div class="info-row">
            <span class="info-row__label">Date</span>
            <span class="info-row__value">29 September 2023</span>
          </div>
        </div>
      </aside>
    </div>
  </div>
</main>

<div id="lightbox" class="lightbox" role="dialog" aria-modal="true">
  <button class="lightbox__close" aria-label="Close">×</button>
  <img class="lightbox__img" src="" alt="">
</div>

<div id="footer-placeholder"></div>
<script src="../src/js/components.js"></script>
</body>
</html>
